app = "tlda-linked-remote-probe"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.git-fixture"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
